# Kafka bootstrap servers
spring.kafka.bootstrap-servers=localhost:9092

# Consumer group
spring.kafka.consumer.group-id=icinemas-notification-service

# Consumer key/value deserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Auto offset reset (start from earliest if no offset found)
spring.kafka.consumer.auto-offset-reset=latest

# Topic names
notification.topic=icinemas-notifications
notification.consumerGroup=icinemas-notification-group

# Gmail SMTP server
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sampleemail@gmail.com
spring.mail.password=testpassword

# Enable authentication and TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Optional: default encoding
spring.mail.default-encoding=UTF-8

logging.level.org.apache.kafka.clients.NetworkClient=WARN
logging.level.org.apache.kafka.clients.consumer.internals.Fetcher=WARN
logging.level.org.apache.kafka.clients.consumer.KafkaConsumer=WARN
logging.level.org.apache.kafka.common.metrics=WARN